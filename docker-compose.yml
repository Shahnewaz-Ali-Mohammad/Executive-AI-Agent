# =============================================================================
#  Executive Agent — supporting services
#
#    postgres     app data (workspaces, documents, chat) + n8n's own database
#    qdrant       vector search index for document passages
#    qdrant-init  one-off: creates the search collection
#    n8n          the AI engine: ingestion, search, answers (imports workflows on first start)
#    web          the Next.js app (optional here: profile "app"; for development
#                 run it with `npm run dev` instead, see README)
#
#  Start:   docker compose up -d
#  Logs:    docker compose logs -f n8n
#  Stop:    docker compose down          (data is kept in volumes)
#  Values come from the .env file next to this one. Without a .env, safe
#  local-only defaults are used (fine for trying it on your own machine;
#  set real secrets in .env before sharing it with anyone).
# =============================================================================

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exec-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-executive_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-n8n-db.sh:/docker-entrypoint-initdb.d/init-n8n-db.sh:ro
    ports:
      # Bound to localhost only: the web app (on your machine) connects here.
      # Port 55432 (not the usual 5432) so it never clashes with another Postgres.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exec} -d ${POSTGRES_DB:-executive_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      # Dashboard: http://localhost:6333/dashboard
      - "127.0.0.1:6333:6333"
    # To require an API key, uncomment and set QDRANT_API_KEY in .env:
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

  qdrant-init:
    image: curlimages/curl:8.11.1
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-executive_docs}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-3072}
    volumes:
      - ./infra/qdrant/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
    # Imports credentials + workflows on first start, then starts n8n.
    entrypoint: ["/bin/sh", "/bootstrap/entrypoint.sh"]
    ports:
      # Editor: http://localhost:5678
      - "127.0.0.1:5678:5678"
    extra_hosts:
      # Lets n8n call the web app running on your machine (Linux needs this line).
      - "host.docker.internal:host-gateway"
    environment:
      # --- n8n itself ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-exec}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-exec-local-password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-encryption-key-change-me}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false" # served over plain http on localhost
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The workflows read their settings below via $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      # Scans/photos are sent to n8n inside the request (base64), so allow large bodies (MiB).
      N8N_PAYLOAD_SIZE_MAX: "64"
      # --- settings read by the Executive Agent workflows ---
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:-local-dev-shared-secret-change-me}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-executive_docs}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-3072}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-6-astra}
      OPENAI_MODEL_FAST: ${OPENAI_MODEL_FAST:-gpt-6-luna}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n/entrypoint.sh:/bootstrap/entrypoint.sh:ro
      - ./n8n/workflows:/workflows:ro

  # Optional: run the web app in Docker too (production build).
  #   docker compose --profile app up -d --build
  # Then open http://localhost:3100
  web:
    profiles: ["app"]
    build: ./web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker, services are reached by name instead of localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-exec}:${POSTGRES_PASSWORD:-exec-local-password}@postgres:5432/${POSTGRES_DB:-executive_agent}
      N8N_BASE_URL: http://n8n:5678
      APP_INTERNAL_URL: http://web:3000
      STORAGE_DIR: /app/storage
    ports:
      - "3100:3000"
    volumes:
      - uploads:/app/storage

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
  uploads:
